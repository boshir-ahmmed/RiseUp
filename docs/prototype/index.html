<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>RiseUp — Verified Startup–Investor Network (UI Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --ink:#101828;--slate:#24324A;--teal:#0A8F85;--teal-d:#077A71;--teal-l:#E6F5F2;--canvas:#F8FAFC;--white:#fff;
  --border:#E2E8F0;--muted:#5B6678;--warn:#B45309;--warn-l:#FEF3E2;--danger:#B42318;--danger-l:#FDECEA;--ok-l:#E6F5F2;
  --r-sm:10px;--r:14px;--r-lg:20px;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:140px}
input,textarea,select,button{color:inherit;font:inherit}
input,textarea{caret-color:var(--teal-d)}
input::placeholder,textarea::placeholder{color:#8A94A6;opacity:1}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--canvas);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--teal-d);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;letter-spacing:-.015em}
h1{font-size:clamp(30px,5vw,52px);font-weight:800}
h2{font-size:clamp(22px,3vw,32px);font-weight:750}
h3{font-size:18px;font-weight:700}
h4{font-size:15px;font-weight:650}
p{margin:0 0 1em}
:focus-visible{outline:3px solid #36B3A8;outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stack>*+*{margin-top:12px}
.grid>*{min-width:0}
.g-search4{grid-template-columns:2fr 1fr 1fr 1fr}.g-search3{grid-template-columns:2fr 1fr 1fr}
@media(max-width:760px){.g-search4,.g-search3{grid-template-columns:1fr 1fr}.g-search4>:first-child,.g-search3>:first-child{grid-column:1/-1}}

.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb0{margin-bottom:0}

/* Demo bar */
.demobar{background:#0B1220;color:#CBD5E1;font-size:12.5px;position:sticky;top:0;z-index:60;border-bottom:1px solid #1E293B}
.demobar .container{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding-top:7px;padding-bottom:7px}
.demobar label{color:#94A3B8}
.demobar select,.demobar button{font:inherit;background:#162033;color:#E2E8F0;border:1px solid #2A3A55;border-radius:8px;padding:4px 8px;cursor:pointer}
.demobar button:hover{background:#1E2B44}
.demobar .tag{background:#7C2D12;color:#FED7AA;border-radius:6px;padding:2px 8px;font-weight:700;letter-spacing:.02em}
.demobar .sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.demobar .sw input{accent-color:#F59E0B}
.clock{font-variant-numeric:tabular-nums;color:#E2E8F0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:14px;border-radius:10px;padding:9px 16px;border:1px solid transparent;cursor:pointer;line-height:1.2;text-decoration:none!important;white-space:nowrap}
.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:var(--teal-d)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:var(--slate)}
.btn-outline{background:#fff;color:var(--ink);border-color:var(--border)}.btn-outline:hover{border-color:#CBD5E1;background:#F8FAFC}
.btn-ghost{background:transparent;color:var(--slate)}.btn-ghost:hover{background:#EEF2F6}
.btn-danger{background:#fff;color:var(--danger);border-color:#F4C7C3}.btn-danger:hover{background:var(--danger-l)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-lg{padding:13px 22px;font-size:15.5px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.b-ver{background:var(--teal-l);color:#05665F;border-color:#BFE6DF}
.b-pend{background:#EEF2FF;color:#3730A3;border-color:#D9DDFE}
.b-warn{background:var(--warn-l);color:var(--warn);border-color:#F8DDB5}
.b-danger{background:var(--danger-l);color:var(--danger);border-color:#F4C7C3}
.b-gray{background:#F1F5F9;color:#475569;border-color:var(--border)}
.b-promo{background:#FFF7E6;color:#8A4B06;border-color:#F6D9A8}
.b-dark{background:var(--ink);color:#fff}

/* Cards */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-b{padding:20px}
.card-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:16px}
.mk-card{border-radius:var(--r-lg)}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none;letter-spacing:.02em}
.logo.lg{width:72px;height:72px;font-size:24px;border-radius:18px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}

/* Header */
.site-h{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);position:sticky;top:var(--dbh,40px);z-index:50}
.site-h .container{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--ink)!important;text-decoration:none!important;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.nav{display:flex;gap:2px;flex:1}
.nav a{color:var(--slate);font-weight:500;font-size:14px;padding:8px 11px;border-radius:8px;text-decoration:none}
.nav a:hover,.nav a.on{background:#F1F5F9;color:var(--ink)}
.hamb{display:none}
@media(max-width:900px){.nav{display:none;position:absolute;left:0;right:0;top:64px;background:#fff;flex-direction:column;padding:10px 16px;border-bottom:1px solid var(--border)}.nav.open{display:flex}.hamb{display:inline-flex}.h-actions .hide-m{display:none}}

/* Hero */
.hero{padding:72px 0 56px;background:radial-gradient(1000px 420px at 80% -10%,#DDF2EE 0,transparent 60%),var(--canvas)}
.hero .lead{font-size:18.5px;color:#3B475A;max-width:620px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--teal-d);background:var(--teal-l);border:1px solid #CBEAE4;padding:5px 12px;border-radius:999px;margin-bottom:18px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero-panel{background:var(--ink);border-radius:24px;padding:22px;color:#E2E8F0;box-shadow:0 24px 60px rgba(16,24,40,.22)}
.hero-panel .hp-row{background:#17233A;border:1px solid #24324A;border-radius:14px;padding:13px 14px;display:flex;gap:12px;align-items:center}
.hero-panel .hp-row+.hp-row{margin-top:10px}
.section{padding:72px 0}
.section.alt{background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.sec-head{max-width:680px;margin-bottom:36px}
.step-n{width:34px;height:34px;border-radius:10px;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.stat{font-size:28px;font-weight:800;letter-spacing:-.02em}
.foot{background:var(--ink);color:#94A3B8;padding:48px 0 28px;font-size:14px}
.foot a{color:#CBD5E1}
.foot h4{color:#fff}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.n-info{background:#F0F7FF;border-color:#CFE2FB;color:#1E3A5F}
.n-warn{background:var(--warn-l);border-color:#F8DDB5;color:#7A3A06}
.n-ok{background:var(--teal-l);border-color:#BFE6DF;color:#04524C}
.n-danger{background:var(--danger-l);border-color:#F4C7C3;color:#7A1A12}
.lock{background:repeating-linear-gradient(135deg,#F8FAFC 0 10px,#F1F5F9 10px 20px);border:1px dashed #CBD5E1;border-radius:12px;padding:16px;color:var(--muted);font-size:14px;text-align:center}

/* Forms */
.field{display:block}
.field>span{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px;color:var(--slate)}
.input,select.input,textarea.input{caret-color:var(--teal-d);width:100%;font:inherit;font-size:14.5px;padding:10px 12px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;color:var(--ink)}
textarea.input{resize:vertical;min-height:110px}
.input:focus{border-color:var(--teal);outline:3px solid rgba(10,143,133,.18)}
.help{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
.help .over{color:var(--danger);font-weight:600}
.err{color:var(--danger);font-size:12.5px;margin-top:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;background:#F1F5F9;border:1px solid var(--border);border-radius:999px;padding:3px 10px;color:#334155}
.chip.x{cursor:pointer}.chip.x:hover{background:#E2E8F0}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;accent-color:var(--teal);width:16px;height:16px}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{appearance:none;width:42px;height:24px;background:#CBD5E1;border-radius:999px;position:relative;cursor:pointer;transition:.15s;margin:0}
.switch input::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--teal)}.switch input:checked::after{left:21px}

/* App shell */
.app{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 40px)}
.side{background:#fff;border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:var(--dbh,40px);height:calc(100vh - var(--dbh,40px));overflow:auto}
.side .who{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--canvas);border:1px solid var(--border);margin:14px 0}
.side nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:9px;color:var(--slate);font-weight:500;font-size:14px;text-decoration:none}
.side nav a:hover{background:#F1F5F9}
.side nav a.on{background:var(--teal-l);color:#05665F;font-weight:650}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#94A3B8;font-weight:700;margin:16px 11px 6px}
.cnt{background:var(--teal);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.main{padding:28px 32px 60px;min-width:0}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-size:26px;margin:0}
.page-h p{margin:4px 0 0;color:var(--muted)}
.mtoggle{display:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:var(--dbh,40px);bottom:0;width:280px;z-index:70;transform:translateX(-100%);transition:.2s;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .main{padding:18px 16px 60px}
  .mtoggle{display:inline-flex}
}
.kpi{padding:18px 20px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500}

/* Tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;padding:10px 14px;border-bottom:1px solid var(--border);background:#FBFCFD;white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid #EEF2F6;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ic{width:44px;height:44px;border-radius:12px;background:#F1F5F9;display:grid;place-items:center;margin:0 auto 10px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{font:inherit;font-weight:600;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}

/* Chat */
.chat{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - var(--dbh,40px) - 150px);min-height:460px}
.chat-list{border-right:1px solid var(--border);overflow:auto}
.chat-item{color:var(--ink);display:flex;gap:10px;padding:13px 14px;border-bottom:1px solid #EEF2F6;cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;font:inherit}
.chat-item:hover{background:#F8FAFC}.chat-item.on{background:var(--teal-l)}
.chat-pane{display:flex;flex-direction:column;min-width:0}
.chat-msgs{flex:1;overflow:auto;padding:18px;background:#FBFCFD;display:flex;flex-direction:column;gap:10px}
.msg{max-width:72%;background:#fff;border:1px solid var(--border);border-radius:14px;padding:9px 12px;font-size:14px}
.msg.me{align-self:flex-end;background:#EAF6F4;border-color:#CBEAE4}
.msg.sys{align-self:center;background:#F1F5F9;border-color:transparent;color:var(--muted);font-size:12.5px;max-width:90%;text-align:center}
.msg .meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:2px}
.msg .acts{display:flex;gap:6px;margin-top:5px}
.msg .acts button{font:inherit;font-size:11.5px;background:none;border:0;color:var(--teal-d);cursor:pointer;padding:0}
.msg.del{font-style:italic;color:var(--muted)}
.chat-in{border-top:1px solid var(--border);padding:12px;display:flex;gap:8px;align-items:flex-end}
.chat-in textarea{min-height:44px;height:44px}
@media(max-width:760px){.chat{grid-template-columns:1fr;height:auto}.chat-list{max-height:220px;border-right:0;border-bottom:1px solid var(--border)}.chat-msgs{min-height:340px}}

/* Modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal .mh h3{margin:0}
.modal .mb{padding:20px 22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{pointer-events:none;position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:400px}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);border-left:4px solid var(--teal)}
.toast.bad{border-left-color:#F97066}
.toast code{background:#24324A;padding:1px 6px;border-radius:5px;font-size:12px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:#F1F5F9;padding:1px 5px;border-radius:5px}
.bar{height:8px;background:#EEF2F6;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}
.post{padding:20px}
.post+.post{border-top:1px solid var(--border)}
.cmt{border-left:2px solid var(--border);padding-left:12px;margin-top:10px}
details>summary{cursor:pointer;font-weight:600}
.reason{font-size:12.5px;background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:2px 8px;display:inline-block;margin:2px 4px 2px 0}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
@media(max-width:560px){.kv{grid-template-columns:1fr}}
.skel{background:linear-gradient(90deg,#EEF2F6,#F8FAFC,#EEF2F6);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}
@keyframes sk{to{background-position:-200% 0}}

/* ---- Feed (Instagram-style) ---- */
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--teal-d);cursor:pointer;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.feed-wrap{display:grid;grid-template-columns:minmax(0,600px) 320px;gap:36px;justify-content:center;padding-top:22px;padding-bottom:64px}
@media(max-width:1060px){.feed-wrap{grid-template-columns:minmax(0,600px)}.feed-side{display:none}}
@media(max-width:640px){.feed-wrap{padding-left:10px;padding-right:10px;padding-top:12px}}
.feed-side{position:sticky;top:calc(var(--dbh,40px) + 86px);align-self:start}
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 14px 10px;background:#fff;border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;scrollbar-width:thin}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex:none;color:var(--ink)!important;text-decoration:none!important;text-align:center}
.story .ring{padding:3px;border-radius:50%;background:conic-gradient(from 200deg,#0A8F85,#36D3C4,#24324A,#0A8F85)}
.story .ring .logo{width:58px;height:58px;border-radius:50%;border:3px solid #fff;font-size:15px}
.story .tiny{width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story.you .ring{background:#CBD5E1}
.ig{margin-bottom:18px;overflow:hidden}
.ig-h{display:flex;align-items:center;gap:10px;padding:11px 14px}
.ig-h .logo{width:38px;height:38px;border-radius:50%;font-size:12px}
.ig-name{font-weight:650;color:var(--ink)!important;font-size:14px}
.vtick{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--teal);color:#fff;font-size:9px;font-weight:800;flex:none}
.promo-l{color:#8A4B06;font-weight:650}
.ig-media{position:relative;aspect-ratio:1/1;}.ig-media:has(video){aspect-ratio:16/9;background:#000}.ig-media{background:#EEF2F6;overflow:hidden;user-select:none;-webkit-user-select:none}
.ig-img{width:100%;height:100%;object-fit:cover;display:block}
.ig-art{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;color:#fff;overflow:hidden}
.ig-art::before{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;border:44px solid rgba(255,255,255,.08)}
.ig-art::after{content:"";position:absolute;left:-50px;top:28%;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06)}
.ig-cat{position:absolute;top:20px;left:20px;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;z-index:1}
.ig-art-t{font-size:clamp(21px,4.4vw,31px);font-weight:800;line-height:1.15;letter-spacing:-.02em;position:relative;z-index:1;text-wrap:balance}
.ig-art-s{opacity:.82;font-size:13px;margin-top:10px;position:relative;z-index:1}
.ig-burst{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;color:#fff;opacity:0;pointer-events:none;text-shadow:0 6px 30px rgba(0,0,0,.35);z-index:2}
.ig-burst.go{animation:burst .85s ease}
@keyframes burst{0%{opacity:0;transform:scale(.4)}15%{opacity:.96;transform:scale(1.12)}30%{transform:scale(.95)}75%{opacity:.96}100%{opacity:0;transform:scale(1)}}
.ig-actions{display:flex;align-items:center;gap:2px;padding:6px 8px 0}
.ig-ic{background:none;border:0;padding:7px;border-radius:9px;cursor:pointer;color:var(--ink);display:inline-grid;place-items:center;text-decoration:none!important}
.ig-ic:hover{background:#F1F5F9}
.ig-ic.on svg{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.ig-body{padding:2px 14px 12px}
.ig-likes{font-weight:700;font-size:14px}
.ig-cap{font-size:14px;margin:4px 0 6px;color:#1F2937}
.ig-cform{display:flex;gap:8px;align-items:center;border-top:1px solid var(--border);padding:6px 14px}
.ig-cform input{border:0;outline:0;flex:1;font:inherit;font-size:14px;padding:8px 0;background:transparent;min-width:0;color:var(--ink);caret-color:var(--teal-d)}
.ig-cform:focus-within{box-shadow:inset 0 2px 0 var(--teal)}
.ig-cform button{background:none;border:0;font:inherit;font-weight:700;color:var(--teal-d);cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:8px;display:block;background:#EEF2F6}
.tile .ig-art{padding:12px}.tile .ig-art-t{font-size:clamp(11px,1.6vw,15px)}.tile .ig-cat,.tile .ig-art-s{display:none}.tile .ig-art::before{width:120px;height:120px;border-width:20px;right:-40px;top:-40px}
.tile-o{position:absolute;inset:0;background:rgba(16,24,40,.6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;opacity:0;transition:.15s;z-index:3}
.tile:hover .tile-o,.tile:focus-visible .tile-o{opacity:1}
.post-detail{display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden}
@media(max-width:860px){.post-detail{grid-template-columns:1fr}}
.pd-side{display:flex;flex-direction:column;border-left:1px solid var(--border);min-width:0}
@media(max-width:860px){.pd-side{border-left:0;border-top:1px solid var(--border)}}
.pd-scroll{flex:1;overflow:auto;padding:14px 16px;max-height:520px}
.side-card{padding:16px}
.sugg{display:flex;align-items:center;gap:10px;padding:7px 0}
.sugg .logo,.sugg .avatar{width:36px;height:36px;font-size:12px;border-radius:50%}
.feed-tabs{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pill{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--slate)}
.pill:hover{border-color:#CBD5E1}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.composer{display:flex;gap:10px;align-items:center;padding:12px 14px;margin-bottom:14px}
.composer a.fake{flex:1;border:1px solid var(--border);border-radius:999px;padding:9px 14px;color:var(--muted);text-decoration:none!important;font-size:14px;background:var(--canvas)}
.welcome{padding:18px 18px 16px;margin-bottom:14px;background:linear-gradient(120deg,#101828,#24324A);color:#E2E8F0;border:0}
@media(max-width:760px){.demobar{position:static}.demobar .container{gap:6px 10px}}
/* v3 — video, pitch room, reels */
.vp{position:relative}.vp video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
.chapters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip.x{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--ink);cursor:pointer}.chip.x:hover{border-color:var(--teal);color:var(--teal)}
.deck .slide{position:relative;aspect-ratio:16/9;border-radius:12px;color:#fff;padding:28px 32px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.deck .sl-k{position:absolute;top:12px;right:16px;font-size:12px;opacity:.75}.deck .sl-t{font-size:clamp(18px,2.6vw,28px);font-weight:800;letter-spacing:-.01em;margin-bottom:10px}.deck .sl-b{font-size:clamp(12px,1.4vw,15px);opacity:.92;line-height:1.5;max-width:60ch}
.wm{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;letter-spacing:.04em;opacity:.55;pointer-events:none}
.thumbs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.th{width:22px;height:14px;border-radius:3px;border:1px solid var(--border);background:#E2E8F0;cursor:pointer;padding:0}.th.on{background:var(--teal);border-color:var(--teal)}
.docview{position:relative;background:#fff;border:1px solid var(--border);border-radius:10px;padding:28px 24px;min-height:320px}.docview .wm{top:50%;bottom:auto;transform:translateY(-50%) rotate(-18deg);font-size:18px;opacity:.12}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#EEF2F6,#F8FAFC,#EEF2F6)}
.room{grid-template-columns:1.5fr 1fr}@media(max-width:900px){.room{grid-template-columns:1fr}}
.qa{padding:10px 0;border-bottom:1px solid #EEF2F6}.qa-a{margin-top:8px;padding:10px 12px;background:#F0FDFA;border-radius:10px;border-left:3px solid var(--teal)}
.bar{height:6px;background:#EEF2F6;border-radius:999px;overflow:hidden;display:inline-block;vertical-align:middle;width:100%}.bar i{display:block;height:100%;background:var(--teal)}
.reel .ig-media video{width:100%;height:100%;object-fit:cover;display:block}.snd{position:absolute;right:10px;bottom:10px;border:0;border-radius:999px;width:34px;height:34px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:14px}
.ig-media video.ig-img{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.linkbtn{background:none;border:0;color:var(--teal);cursor:pointer;padding:0;text-decoration:underline}
.vd{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 7px;border-radius:999px}
/* ===================== v4 design system ===================== */
:root{--canvas:#F3F4F6;--border:#E4E7EC;--ink:#0F172A;--teal:#0B8F84;--teal-d:#087068;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--shadow-h:0 10px 30px rgba(16,24,40,.10);--r:16px}
body{background:var(--canvas)}
h1,h2,h3,.brand,.prof-n,.pk-n,.pk-amt{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
.card{border-color:var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border-radius:999px;font-weight:600;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:#0B8F84 linear-gradient(180deg,#0EA597,#0B8F84);box-shadow:0 1px 2px rgba(11,143,132,.25)}
.btn-primary:hover{background:#087068 linear-gradient(180deg,#0B8F84,#087068)}
.btn-outline{border-color:#D0D5DD}
.chip{border-radius:999px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
img.avatar,img.logo{object-fit:cover;display:block;background:#E4E7EC}
img.avatar{border-radius:50%}
.vtick{background:#0B8F84}

/* ---- Top bar (every signed-in page) ---- */
.tb{position:sticky;top:var(--dbh,40px);z-index:60;background:rgba(255,255,255,.97);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--border)}
.tb-in{max-width:1320px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:14px}
.tb .brand{font-size:19px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:9px;font-weight:800}
.tb-search{flex:0 1 320px;display:flex;align-items:center;gap:8px;background:#EEF1F5;border:1px solid transparent;border-radius:999px;padding:0 14px;height:40px;color:#667085;transition:.15s}
.tb-search:focus-within{background:#fff;border-color:#98A2B3;box-shadow:0 0 0 4px rgba(11,143,132,.12)}
.tb-search input{border:0;background:transparent;outline:0;flex:1;font-size:14px;min-width:0;color:var(--ink)}
.tb-nav{display:flex;margin-left:auto;gap:2px;height:100%}
.tb-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:78px;padding:0 8px;color:#667085;font-size:12px;font-weight:500;position:relative;text-decoration:none!important;border-bottom:2px solid transparent;transition:color .15s}
.tb-nav a:hover{color:var(--ink)}
.tb-nav a.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:650}
.tb-nav .dot{position:absolute;top:7px;left:calc(50% + 3px);background:#E11D48;color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;min-width:17px;text-align:center;border:2px solid #fff}
.tb-me{position:relative;height:100%;display:flex;align-items:center;border-left:1px solid var(--border);padding-left:10px}
.tb-mebtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;color:#667085;font-size:12px;font-weight:500;padding:4px 8px;border-radius:10px}
.tb-mebtn:hover{color:var(--ink)}
.tb-mebtn .avatar{width:26px!important;height:26px!important;font-size:10px!important}
.tb-me .menu{position:absolute;right:0;top:58px;width:290px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(16,24,40,.18);padding:14px;z-index:80}
.tb-me .menu-h{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.tb-me .menu a[role=menuitem]{display:block;padding:9px 10px;border-radius:9px;color:var(--ink);font-size:14px;text-decoration:none}
.tb-me .menu a[role=menuitem]:hover{background:#F2F4F7}
@media(max-width:1100px){.tb-nav a{min-width:60px}.tb-nav .lbl{display:none}.tb-nav a{gap:0}}
@media(max-width:760px){
  .tb{backdrop-filter:none;background:#fff}.tb-search{display:none}.hide-s{display:none}
  .tb-nav{position:fixed;left:0;right:0;bottom:0;height:60px;background:#fff;border-top:1px solid var(--border);justify-content:space-around;z-index:65;margin:0}
  .tb-nav a{border-bottom:0;border-top:2px solid transparent;flex:1}.tb-nav a.on{border-top-color:var(--ink)}
  .tb-me{margin-left:auto;border-left:0}.tb-mebtn .lbl{display:none}
  body:has(.tb){padding-bottom:64px}
}

/* ---- App shell with left sidebar ---- */
.app{grid-template-columns:276px minmax(0,1fr);max-width:1320px;margin:0 auto;min-height:auto}
.side{background:transparent;border-right:0;padding:20px 8px 24px 20px;top:calc(var(--dbh,40px) + 63px);height:calc(100vh - var(--dbh,40px) - 63px)}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:#D0D5DD;border-radius:6px}
.side-nav{padding:8px}
.side-nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;color:#344054;font-weight:500;font-size:14px;text-decoration:none}
.side-nav a:hover{background:#F2F4F7;text-decoration:none}
.side-nav a.on{background:#E7F6F4;color:#05665F;font-weight:650}
.side-nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#98A2B3;font-weight:700;margin:12px 12px 6px}
.side-nav .grp:first-child{margin-top:6px}
.side-nav .cnt{background:#0B8F84;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.side-foot{padding:14px 8px 0;line-height:1.7}
.side-foot a{color:#667085}
.main{padding:20px 24px 60px 16px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{background:#F3F4F6;top:calc(var(--dbh,40px) + 63px);padding:16px}.main{padding:16px 14px 70px}}
@media(max-width:520px){.pc-h .btn{display:none}.pc-h{padding:12px 14px 6px}.pc-text{padding:0 14px 10px}}

/* sidebar profile card */
.spc{overflow:hidden;margin-bottom:12px;text-align:center}
.spc-cover{height:58px}
.spc-av{display:inline-block;margin-top:-34px;border-radius:50%;border:3px solid #fff;background:#fff;line-height:0}
.spc-av .avatar{width:64px;height:64px;font-size:22px}
.spc-b{padding:6px 14px 12px}
.spc-n{font-weight:700;color:var(--ink);font-size:16px}
.spc-s{border-top:1px solid #EEF1F5;padding:8px 0}
.spc-s a{display:flex;justify-content:space-between;padding:5px 16px;font-size:12.5px;color:#475467;text-decoration:none}
.spc-s a:hover{background:#F9FAFB}.spc-s b{color:#0B8F84}
.spc-e{display:flex;align-items:center;justify-content:center;gap:6px;border-top:1px solid #EEF1F5;padding:10px;font-size:13px;font-weight:600;color:#344054;text-decoration:none}
.spc-e:hover{background:#F9FAFB;text-decoration:none}

/* ---- Feed ---- */
.feed-wrap.in-app{display:grid;grid-template-columns:minmax(0,620px) 300px;gap:22px;padding:0;max-width:none}
.feed-wrap.pub3{grid-template-columns:230px minmax(0,600px) 300px;gap:22px;justify-content:center}
.feed-left{position:sticky;top:calc(var(--dbh,40px) + 86px);align-self:start}
.feed-side{position:sticky;top:calc(var(--dbh,40px) + 86px);align-self:start}
.in-app .feed-side{top:calc(var(--dbh,40px) + 82px)}
@media(max-width:1240px){.feed-wrap.in-app{grid-template-columns:minmax(0,640px)}.in-app .feed-side{display:none}.feed-wrap.pub3{grid-template-columns:minmax(0,600px) 300px}.feed-left{display:none}}
@media(max-width:1060px){.feed-wrap.pub3{grid-template-columns:minmax(0,640px)}}
.hero-mini{background:#0F172A linear-gradient(140deg,#0F172A,#134E4A);color:#fff;border:0}
.hero-mini p{color:#CBD5E1}
.join-card{background:linear-gradient(160deg,#ECFDF9,#fff)}

.comp{padding:14px 16px 8px;margin-bottom:14px}
.comp-top{display:flex;gap:12px;align-items:center}
.comp-fake{flex:1;border:1px solid #D0D5DD;border-radius:999px;padding:12px 18px;color:#667085;font-size:14px;font-weight:500;text-decoration:none!important;transition:.15s}
.comp-fake:hover{background:#F2F4F7}
.comp-acts{display:flex;justify-content:space-around;margin-top:8px}
.comp-acts a{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:600;text-decoration:none!important}
.comp-acts a span{color:#475467}.comp-acts a:hover{background:#F2F4F7}
@media(max-width:440px){.comp-acts a{padding:9px 8px}.comp-acts a span{display:none}.comp-fake{padding:11px 14px;font-size:13px}}
.stories{border-radius:var(--r)}
.feed-tabs .pill{border-radius:999px}

/* post card */
.pc{margin-bottom:14px;overflow:hidden;transition:box-shadow .2s}
.pc:hover{box-shadow:var(--shadow-h)}
.pc-h{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 8px}
.pc-h .logo{width:48px;height:48px;border-radius:12px;font-size:14px}
.pc-text{padding:0 16px 12px}
.catc{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.01em}
.pc-title{font-size:17px;margin:8px 0 4px;line-height:1.3}
.pc-body{color:#344054;line-height:1.55}
.pc .ig-media{border-radius:0}.pc .ig-cat{display:none}.pc .ig-media:not(:has(video)){aspect-ratio:4/3}
.pc-stats{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;font-size:12.5px;color:#667085;border-bottom:1px solid #EEF1F5;flex-wrap:wrap}
.pc-stats a{color:#667085}
.hb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#E11D48;color:#fff;font-size:10px;margin-right:2px}
.pc-acts{display:grid;grid-template-columns:repeat(4,1fr);padding:4px 8px}
.pc-acts button{display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:0;padding:10px 6px;border-radius:10px;font:inherit;font-size:13.5px;font-weight:600;color:#475467;cursor:pointer}
.pc-acts button:hover{background:#F2F4F7}
.pc-acts button.on{color:#E11D48}
.pc-acts button[data-act=savepost].on{color:#0B8F84}
.pc-cmts{padding:6px 16px 4px}
.pc-c{display:flex;gap:10px;padding:6px 0;align-items:flex-start}
.pc-c .avatar{width:32px;height:32px;font-size:11px}
.pc-cb{background:#F2F4F7;border-radius:4px 14px 14px 14px;padding:8px 12px;min-width:0;flex:1}
.ig-cform{gap:10px;padding:10px 16px 14px;border-top:0}
.ig-cform input{border:1px solid #D0D5DD;border-radius:999px;padding:9px 16px}
.ig-cform:focus-within{box-shadow:none}
.ig-cform:focus-within input{border-color:#0B8F84;box-shadow:0 0 0 3px rgba(11,143,132,.12)}
.ig-cform .avatar{width:32px;height:32px;font-size:11px}
@media(max-width:520px){.pc-acts span{display:none}}

/* pitch spotlight */
.pk{margin-bottom:14px;overflow:hidden;border:0;box-shadow:0 0 0 1px rgba(11,143,132,.25),0 12px 32px rgba(15,23,42,.10)}
.pk-media{position:relative;aspect-ratio:16/9;background:var(--pc);overflow:hidden}
.pk-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.pk:hover .pk-media img{transform:scale(1.03)}
.pk-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0) 55%,rgba(15,23,42,.45))}
.pk-tag{position:absolute;top:14px;left:14px;background:linear-gradient(90deg,#F59E0B,#F97316);color:#fff;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
.pk-dur{position:absolute;bottom:14px;right:14px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.pk-play{position:absolute;left:16px;bottom:16px;width:58px;height:58px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#0F172A;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s}
.pk-play:hover{transform:scale(1.08)}
.pk-play svg{margin-left:4px}
.pk-over{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
.pk-over .logo{width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.85)}
.pk-n{font-weight:800;font-size:18px;line-height:1.25}
.pk-t{font-size:13px;opacity:.9}
.pk-b{padding:14px 16px 16px;display:grid;gap:12px}
.chip-btn{border:1px solid #99D9D1;background:#ECFDF9;color:#05665F;cursor:pointer;font:inherit;font-size:12px;font-weight:600}
.pk-ask{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;gap:10px;background:linear-gradient(135deg,#ECFDF9,#F0F9FF);border:1px solid #CCEFEA;border-radius:14px;padding:12px 14px}
.pk-amt{font-size:22px;font-weight:800;color:#065F57;letter-spacing:-.02em}
.pk-m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk-m div{background:#F9FAFB;border:1px solid #EEF1F5;border-radius:12px;padding:8px 10px}
.pk-m b{display:block;font-size:15px}.pk-m span{font-size:11.5px;color:#667085}
.pk-lock{background:#F9FAFB;border:1px dashed #D0D5DD;border-radius:12px;padding:10px 12px;font-size:13px;color:#475467}
.pk-hl{margin:0;padding:0;list-style:none;display:grid;gap:4px}

@media(max-width:560px){.pk-ask{grid-template-columns:1fr 1fr}}

.tp{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:7px 4px;border-radius:10px;cursor:pointer;font:inherit;color:inherit}
.tp:hover{background:#F2F4F7}

.tp-th img{width:100%;height:100%;object-fit:cover;opacity:.85}
.tp-th span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px}

/* ---- Profile ---- */
.prof{overflow:hidden}
.prof-cover{height:200px}
.prof-b{padding:0 28px 24px;position:relative}
.prof-av{margin-top:-80px;display:inline-block;border:5px solid #fff;border-radius:50%;background:#fff;line-height:0;margin-bottom:10px}
.prof-n{font-size:28px;margin:0;display:flex;align-items:center;gap:8px}
.prof-hl{font-size:16px;color:#344054;margin-top:2px}
.cover-prev{height:110px;border-radius:12px}
.crop-wrap{display:grid;place-items:center;background:repeating-conic-gradient(#F2F4F7 0 25%,#fff 0 50%) 0 0/20px 20px;border-radius:12px;padding:14px}

const AI1_BLOCK=[/guarantee[ds]?\s+(return|profit)/i,/risk[- ]?free/i,/double your money/i,/no risk/i,/100%\s*return/i,/\bscam\b/i,/whatsapp me/i];
function model1(text){ // Content-safety model: returns validated Approve/Reject only
  if(S.ai1Down) return {decision:"Unavailable"};
  for(const re of AI1_BLOCK) if(re.test(text)) return {decision:"Reject",reason:"misleading_financial_claim",version:"m1-2026.10"};
  if(text.trim().length<20) return {decision:"Reject",reason:"insufficient_content",version:"m1-2026.10"};
  return {decision:"Approve",version:"m1-2026.10"};
}
const pairPending=(sid,iid)=>S.requests.find(r=>r.sid===sid&&r.iid===iid&&r.status==="Pending");
const connected=(sid,iid)=>S.connections.find(c=>c.sid===sid&&c.iid===iid);
const blocked=(sid,iid)=>S.blocks.find(b=>b.sid===sid&&b.iid===iid);
function cooldown(sid,iid,type){ // early rejection: no resend until original send + 14 days
  const rej=S.requests.filter(r=>r.sid===sid&&r.iid===iid&&r.type===type&&r.status==="Rejected"&&S.now<r.sentAt+14*DAY);
  return rej.length?Math.max(...rej.map(r=>r.sentAt+14*DAY)):0;
}
function isVerified(o){return o&&o.status==="Verified"&&!o.suspended}
function pitchEligibility(sid,iid){
  const s=st(sid),i=inv(iid),w=S.wallets[sid]||{welcome:0,purchased:0};
  if(!isVerified(s)) return fail(s.suspended?"account_suspended":"not_verified","Your startup must be verified before pitching.");
  if(!i||i.status!=="Verified") return fail("investor_not_verified","This investor is not verified.");
  if(blocked(sid,iid)) return fail("blocked","A block exists between you and this investor.");
  if(connected(sid,iid)) return fail("already_connected","You are already connected; use your existing conversation.");
  if(pairPending(sid,iid)) return fail("pending_request_exists","A pending pitch or invitation already exists for this pair. No token was charged.");
  const cd=cooldown(sid,iid,"pitch"); if(cd) return fail("cooldown_active",`Your last pitch was declined. You can pitch again after ${fmt(cd)} (original send + 14 days).`);
  if(!i.receive) return fail("pitch_disabled","This investor has Receive Pitches turned OFF. No token was charged.");
  if(w.welcome+w.purchased<1) return fail("insufficient_tokens","You have no tokens left. Buy a token package to continue.");
  return ok();
}
function sendPitch(sid,iid,text,draftId){
  if(R().kind!=="founder") return fail("forbidden","Only the Main Startup Owner can pitch.");
  if(!text||text.trim().length===0) return fail("validation","Write your pitch first.");
  if(text.length>3000) return fail("validation","Pitch exceeds 3,000 characters.");
  let d=S.drafts.find(x=>x.id===draftId);
  if(!d){d={id:uid("D"),sid,iid,text,at:S.now,status:"Draft"};S.drafts.push(d)} else {d.text=text;d.iid=iid;d.at=S.now}
  const pre=pitchEligibility(sid,iid); if(!pre.ok){d.status="Draft";return pre}
  d.status="Pending AI check";
  const m=model1(text);
  if(m.decision==="Unavailable"){d.status="Draft · AI unavailable";return fail("ai_temporarily_unavailable","Content-safety check is unavailable. Your draft is saved, nothing was sent and no token was charged. Retry later.")}
  if(m.decision==="Reject"){d.status="Rejected by AI";d.reason=m.reason;return fail("content_rejected",`AI Model 1 rejected this pitch (${m.reason}). Edit and resubmit — no token was charged.`)}
  // --- transaction: recheck at commit time, debit, persist request ---
  const re=pitchEligibility(sid,iid); if(!re.ok){d.status="Draft";return re}
  const w=S.wallets[sid]; const bucket=w.welcome>0?"Welcome":"Purchased"; w[bucket.toLowerCase()]-=1;
  const pk=pkgOf(sid); const r={id:uid("r"),type:"pitch",sid,iid,sentAt:S.now,exp:S.now+14*DAY,status:"Pending",text,bucket,ai:m.version,pkgVersion:pk?pk.version:0,docIds:(window._pitchDocs||(pk?pk.docs.filter(d=>d.scan==="Clean").map(d=>d.id):[])),ev:{opened:null,watch:{pitch:0,demo:0},slides:new Set(),docs:new Set()},questions:[]};
  S.requests.push(r); ledger(sid,`Pitch delivered → ${inv(iid).name}`,bucket,-1,"req:"+r.id);
  S.drafts=S.drafts.filter(x=>x!==d);
  notify("investor:"+iid,`New pitch from ${st(sid).name}.`);
  return ok(`Pitch delivered to ${inv(iid).name}. 1 ${bucket} token debited.`);
}
function invitesToday(iid){const day=dhakaDay(S.now);return S.requests.filter(r=>r.type==="invitation"&&r.iid===iid&&dhakaDay(r.sentAt)===day).length}
function sendInvitation(iid,sid,text){
  const i=inv(iid),s=st(sid);
  if(!isVerified(i)) return fail("not_verified","Only verified investors can send invitations.");
  if(!isVerified(s)) return fail("startup_not_verified","Invitations can only be sent to verified startups.");
  if(blocked(sid,iid)) return fail("blocked","A block exists between you and this startup.");
  if(connected(sid,iid)) return fail("already_connected","You are already connected with this startup.");
  if(pairPending(sid,iid)) return fail("pending_request_exists","A pending pitch or invitation already exists for this pair. Your daily allowance was not used.");
  const cd=cooldown(sid,iid,"invitation"); if(cd) return fail("cooldown_active",`Your previous invitation was declined. You can re-invite after ${fmt(cd)}.`);
  if(invitesToday(iid)>=10) return fail("invitation_daily_limit","You have used all 10 invitations for today (Asia/Dhaka). Allowance resets at 00:00.");
  const r={id:uid("r"),type:"invitation",sid,iid,sentAt:S.now,exp:S.now+14*DAY,status:"Pending",text:text||""};
  S.requests.push(r); notify("founder:"+sid,`${i.name} sent you an invitation.`);
  return ok(`Invitation sent to ${s.name}. ${10-invitesToday(iid)} left today.`);
}
function respond(rid,accept,reason){
  const r=S.requests.find(x=>x.id===rid); const k=R().kind;
  if(!r||r.status!=="Pending") return fail("not_pending","This request is no longer pending.");
  if(r.type==="pitch"&&!(k==="investor"&&R().iid===r.iid)) return fail("forbidden","Only the receiving investor can decide.");
  if(r.type==="invitation"&&!(k==="founder"&&R().sid===r.sid)) return fail("forbidden","Only the Main Startup Owner can decide invitations.");
  if(!accept){r.status="Rejected";r.decidedAt=S.now;r.reason=reason||"";notify(r.type==="pitch"?"founder:"+r.sid:"investor:"+r.iid,`${r.type==="pitch"?inv(r.iid).name:st(r.sid).name} declined your ${r.type}.`);return ok("Request declined. The sender may try again 14 days after the original send time.")}
  if(connected(r.sid,r.iid)) return fail("already_connected","Already connected.");
  r.status="Accepted";r.decidedAt=S.now;
  const c={id:uid("c"),sid:r.sid,iid:r.iid,members:["owner","investor"],muted:{},archived:{},messages:[{id:uid("m"),sys:true,text:"Connection established. Contact details are now visible to both parties. Investment agreements and transfers happen outside RiseUp.",at:S.now}]};
  S.convs.push(c); S.connections.push({id:uid("cn"),sid:r.sid,iid:r.iid,at:S.now,conv:c.id});
  notify("founder:"+r.sid,`You are now connected with ${inv(r.iid).name}.`); notify("investor:"+r.iid,`You are now connected with ${st(r.sid).name}.`);
  return ok("Accepted — one connection and one private group chat were created.");
}
function cancelPendingFor(pred,why){let n=0;S.requests.forEach(r=>{if(r.status==="Pending"&&pred(r)){r.status="Cancelled";r.decidedAt=S.now;r.reason=why;n++}});return n}
function runJobs(){ // background jobs: expiry + promotion clocks
  S.requests.forEach(r=>{if(r.status==="Pending"&&S.now>=r.exp){r.status="Expired";r.decidedAt=r.exp}});
}
function advance(ms){
  Object.values(S.pitchPkgs||{}).forEach(p=>{["pitch","demo","teaser"].forEach(k=>{if(p[k]&&p[k].scan==="Pending scan")p[k].scan="Clean"});if(p.deckFile&&p.deckFile.scan==="Pending scan")p.deckFile.scan="Clean";p.docs.forEach(d=>{if(d.scan==="Pending scan")d.scan="Clean"})});
  const prev=S.now; S.now+=ms;
  S.promotions.forEach(p=>{
    if(p.status!=="Active") return;
    const used=Math.min(ms,p.remaining); p.remaining-=used;
    const k=used/DAY; p.imp+=Math.round(900*k); p.clicks+=Math.round(40*k); p.eng+=Math.round(12*k);
    if(S.ai2Down) p.ruleSegments+=Math.round(900*k);
    if(p.remaining<=0){p.status="Completed";p.remaining=0}
  });
  runJobs();
}

function resumePromos(sid){S.promotions.forEach(p=>{if(p.sid===sid&&p.status==="Paused"){p.status="Active";p.pauseWhy=null}})}

/* Model 2 — matching. Falls back to deterministic rules when unavailable. */
function overlap(a1,a2,b1,b2){return Math.max(0,Math.min(a2,b2)-Math.max(a1,b1))>0}
function matchScore(s,i){
  const reasons=[];let sc=0;
  if(i.industries.includes(s.industry)){sc+=40;reasons.push(`Sector match: ${s.industry}`)}
  if(i.stages.includes(s.stage)){sc+=30;reasons.push(`Stage fit: ${s.stage}`)}
  if(s.goal>=i.min&&s.goal<=i.max*2&&overlap(i.min,i.max,s.goal*0.1,s.goal)){sc+=20;reasons.push(`Ticket range ${usd(i.min)}–${usd(i.max)} fits a ${usd(s.goal)} raise`)}
  if(i.location.includes(s.location)){sc+=10;reasons.push(`Same region: ${s.location}`)}
  return {sc,reasons};
}
function rank(list,score){
  const ai=!S.ai2Down;
  return list.map(x=>{const m=score(x);let sc=m.sc;
    if(ai){/* AI layer adds bounded semantic relevance; explanations remain evidence-based */ sc+= (x.tags||x.industries||[]).length%3;}
    return {x,sc:Math.min(98,sc),reasons:m.reasons.length?m.reasons:["Limited overlap — shown for discovery"],engine:ai?"AI Model 2":"Rule-based fallback"}}).sort((a,b)=>b.sc-a.sc);
}

    return [["Workspace",[["home","Home feed"],["dashboard","Dashboard"],["discover","Discover investors"],["pitches","Pitch Studio"],["requests","Requests",pendIn],["chats","Conversations"]]],

      ["Account",[["me","My profile"],["account","Edit profile"],["wallet","Wallet"],["notifications","Notifications",nUnread],["settings","Settings & security"]]]];
  }
  if(r.kind==="investor"){
    const pend=S.requests.filter(x=>x.iid===r.iid&&x.type==="pitch"&&x.status==="Pending").length;
    return [["Workspace",[["home","Home feed"],["dashboard","Dashboard"],["discover","Discover startups"],["requests","Pitches & invitations",pend],["shortlist","Shortlist"],["chats","Conversations"],["library","Shared documents"]]],
      ["Account",[["me","My profile"],["account","Edit profile"],["profile","Investment preferences"],["verification","Verification"],["notifications","Notifications",nUnread],["settings","Settings & security"]]]];
  }
  if(r.kind==="team") return [["Workspace",[["home","Home feed"],["chats","Conversations"],["notifications","Notifications",nUnread]]],["Account",[["me","My profile"],["account","Edit profile photo"]]]];
  if(r.kind==="admin"){

/* Conversations */
function myConvs(){
  const r=R();
  if(r.kind==="founder") return S.convs.filter(c=>c.sid===r.sid);
  if(r.kind==="investor") return S.convs.filter(c=>c.iid===r.iid);
  if(r.kind==="team"){const t=S.team.find(x=>x.id===r.tid);if(!t||t.status!=="Active")return[];return S.convs.filter(c=>c.members.includes(r.tid))}
  return [];
}
function myMemberKey(){const r=R();return r.kind==="founder"?"owner":r.kind==="investor"?"investor":r.tid}
function convDisabled(c){
  if(st(c.sid).deleted) return "The startup account was deleted. The remaining history is read-only and the deleted party is anonymised.";
  if(inv(c.iid).deleted) return "The investor account was deleted. The remaining history is read-only and the deleted party is anonymised.";
  if(blocked(c.sid,c.iid)) return "Messaging is paused because one party blocked the other.";
  if(st(c.sid).suspended) return "Messaging is disabled while the startup account is suspended.";
  if(inv(c.iid).suspended) return "Messaging is disabled while the investor account is suspended.";
  return "";
}
function pageChats(){
  const r=R(); const list=myConvs();

  let cur=list.find(c=>c.id===window._conv)||list[0]; window._conv=cur.id;
  const title=c=>r.kind==="investor"?st(c.sid).name:inv(c.iid).name; // FR-094

  const members=cur.members.map(m=>m==="owner"?st(cur.sid).owner+" (owner)":m==="investor"?inv(cur.iid).name+" (investor)":(S.team.find(t=>t.id===m)||{}).name+" (team)");
  return pageH("Conversations","One private group per startup–investor pair. Messages are never read by AI.")+
  `<div class="card chat"><div class="chat-list" role="list">${list.map(c=>`<button class="chat-item ${c.id===cur.id?"on":""}" data-act="conv" data-c="${c.id}" role="listitem">${r.kind==="investor"?logo(st(c.sid)):av(inv(c.iid).name,inv(c.iid).c)}<div style="min-width:0;flex:1"><div class="row between"><strong class="small">${esc(title(c))}</strong>${c.muted[me]?`<span class="tiny muted">muted</span>`:""}</div><div class="tiny muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(lastMsg(c))}</div></div></button>`).join("")}</div>
  <div class="chat-pane"><div class="card-h" style="padding:12px 16px"><div><strong>${esc(title(cur))}</strong><div class="tiny muted">${esc(members.join(" · "))}</div></div>

    ${r.kind!=="team"&&connected(cur.sid,cur.iid)?`<div class="tiny" style="padding:8px 16px;background:#F8FAFC;border-bottom:1px solid var(--border)">Contact: ${r.kind==="investor"?`${esc(st(cur.sid).email)} · ${esc(st(cur.sid).phone)}`:`${esc(inv(cur.iid).email)} · ${esc(inv(cur.iid).phone)}`}</div>`:""}
    <div class="chat-msgs" id="msgs">${cur.messages.map(m=>{

/* ------------------------------- Router ---------------------------------- */
const PUBLIC=new Set(["home","startups","feed","reels","investors","how","about","pricing","faq","login","register","forgot","contact"]);
const APP={dashboard:1,discover:1,pitches:1,requests:1,shortlist:1,chats:1,team:1,library:1,posts:1,promotions:1,wallet:1,notifications:1,settings:1,profile:1,verification:1};
const ALLOWED={founder:Object.keys(APP),investor:["dashboard","discover","requests","shortlist","chats","library","notifications","settings","profile","verification"],team:["chats","notifications"]};
function route(){return (location.hash||"#home").slice(1)||"home"}
function render(){
  renderDemoBar();
  const rt=route(); const r=R(); let html;
  if((rt==="home"||rt==="feed")&&signedIn()) html=shell("home",pageHome(),true);
  else if(rt==="me"||rt==="account"){ html=signedIn()?shell(rt,rt==="me"?pageMe():pageAccount()):hdr("")+pageLogin()+siteFooter(); }
  else if(rt.startsWith("startup-")) html=hdr("startups")+pageStartupDetail(rt.slice(8))+siteFooter();
  else if(rt.startsWith("post-")) html=hdr("home")+pagePost(rt.slice(5))+siteFooter();
  else if(rt.startsWith("pitchroom-")){ html=r.kind==="visitor"?hdr("")+pageLogin()+siteFooter():shell(r.kind==="investor"?"requests":"pitches",pagePitchRoom(rt.slice(10))); }
  else if(rt==="reels") html=hdr("home")+pageReels()+siteFooter();
  else if(rt.startsWith("investor-")) html=hdr("investors")+pageInvestorDetail(rt.slice(9))+siteFooter();
  else if(rt.startsWith("legal-")) html=hdr("")+pageLegal(rt.slice(6))+siteFooter();
  else if(PUBLIC.has(rt)){
    const f={home:pageHome,about:pageAbout,startups:pageStartups,feed:pageHome,investors:pageInvestorsPublic,how:pageHow,pricing:pagePricing,faq:pageFaq,login:pageLogin,register:pageRegister,forgot:pageForgot,contact:pageContact}[rt];
    html=hdr(rt==="feed"?"home":rt)+f()+(rt==="home"||rt==="feed"?"":siteFooter());
  } else if(APP[rt]||rt.startsWith("admin")){
    if(r.kind==="visitor") html=hdr("")+pageLogin()+siteFooter();
    else if(rt.startsWith("admin")){
      const allow=ADMIN_ROUTES[rt];
      if(r.kind!=="admin"||!allow||!(allow[0]==="*"||allow.includes(r.adm))) html=r.kind==="admin"?shell(rt,pageError(403)):hdr("")+pageError(403)+siteFooter();
      else html=shell(rt,{admin:adminOverview,"admin-verify":adminVerify,"admin-reports":adminReports,"admin-finance":adminFinance,"admin-settings":adminSettings,"admin-audit":adminAudit,"admin-profiles":adminProfiles}[rt]());
    } else {
      if(r.kind==="admin") html=shell(rt,pageError(403));
      else if(!ALLOWED[r.kind].includes(rt)) html=shell(rt,pageError(403));
      else {
        const f={dashboard:r.kind==="founder"?founderDash:investorDash,discover:pageDiscover,pitches:pagePitches,requests:pageRequests,shortlist:pageShortlist,chats:pageChats,team:pageTeam,library:pageLibrary,posts:pagePosts,promotions:pagePromotions,wallet:pageWallet,notifications:pageNotifs,settings:pageSettings,profile:pageProfile,verification:pageVerification}[rt];
        html=shell(rt,f());
      }
    }
  } else html=hdr("")+pageError(404)+siteFooter();
  if(rt==="notifications"&&R().kind!=="visitor"){const k=audKey();window._unreadIds=new Set(S.notifs.filter(n=>n.to===k&&!n.read).map(n=>n.id))}
  $("#app").innerHTML=html;
  document.querySelectorAll("[data-c]").forEach(updCount);
  const m=$("#msgs"); if(m) m.scrollTop=m.scrollHeight;
  if(rt==="notifications"&&R().kind!=="visitor"){S.notifs.forEach(n=>{if(n.to===audKey())n.read=true});document.querySelectorAll(".side .cnt,.tb-nav .dot").forEach(c=>{if(c.closest("a")?.getAttribute("href")==="#notifications")c.remove()})}
  // responsive helper for 2-col page grids
  ["#sd-grid","#pgrid","#pgrid2","#pgrid3"].forEach(id=>{const g=$(id);if(g&&innerWidth<900)g.style.gridTemplateColumns="1fr"});
  if(typeof v3AfterRender==="function") v3AfterRender();
}
function go(h){if(location.hash==="#"+h)render();else location.hash=h}
function updCount(el){const c=document.querySelector(`[data-count="${el.dataset.c}"]`);if(!c)return;const n=el.value.length,mx=+c.dataset.max;c.textContent=`${n.toLocaleString()} / ${mx.toLocaleString()}`;c.className=n>mx?"over":""}

function setRole(k){
  const rr=ROLES[k];
  if(rr.kind==="admin"&&!S.mfaOk[k]){
    modal("Administrator sign-in · two-factor required",`<p class="small muted">All administrators must complete strong two-factor authentication.</p><label class="field"><span>6-digit authenticator code</span><input class="input" id="mfa" inputmode="numeric" maxlength="6" placeholder="Any 6 digits (demo)" autocomplete="one-time-code"></label><div class="err" id="mfaerr"></div>`,`<button class="btn btn-outline" data-act="modal-close">Cancel</button><button class="btn btn-primary" data-act="m-ok">Verify</button>`,
      ()=>{const v=$("#mfa").value;if(!/^\d{6}$/.test(v)){$("#mfaerr").textContent="Enter a 6-digit code.";return false}S.mfaOk[k]=true;S.role=k;closeModal();go("admin");toast(ok("2FA verified."))});
    renderDemoBar(); return;
  }
  S.role=k; window._conv=null;
  if(rr.kind==="visitor") go("home"); else if(rr.kind==="admin") go("admin"); else if(rr.kind==="team") go("chats"); else go("dashboard");
}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="roleSel") return setRole(t.value);
  if(t.id==="fcat"){window._feed.cat=t.value;window._feed.n=5;return render()}
  if(t.id==="ai1"){S.ai1Down=t.checked;toast(ok(t.checked?"AI Model 1 outage simulated — posts and pitches will fail closed.":"AI Model 1 restored."));return render()}
  if(t.id==="ai2"){S.ai2Down=t.checked;toast(ok(t.checked?"AI Model 2 outage simulated — rule-based matching and targeting active.":"AI Model 2 restored — AI targeting resumed."));return render()}
  if(t.dataset.act==="togglepitch"){const i=inv(R().iid);i.receive=t.checked;toast(ok(`Receive Pitches turned ${i.receive?"ON":"OFF"}. Pending pitches and chats are unaffected.`));return render()}
  if(t.dataset.act==="grant"){
    const g=S.grants.findIndex(x=>x.doc===t.dataset.d&&x.iid===t.dataset.i);
    if(t.checked&&g<0){S.grants.push({doc:t.dataset.d,iid:t.dataset.i,at:S.now});notify("investor:"+t.dataset.i,`${st(R().sid).name} shared a confidential document with you.`);toast(ok("Access granted to this investor only."))}
    if(!t.checked&&g>=0){S.grants.splice(g,1);toast(ok("Access revoked immediately."))}
    return render();
  }
});

   ()=>{const v=$("#rsn").value.trim();if(v.length<5){$("#rsnerr").textContent="A reason of at least 5 characters is required.";return false}closeModal();cb(v)});

const passwordRequirements = "Use at least 12 characters, including an uppercase letter, a lowercase letter, and a number.";
function meetsPasswordPolicy(value){
  return [...value].length >= 12 && /\p{Lu}/u.test(value) && /\p{Ll}/u.test(value) && /\p{Nd}/u.test(value);
}
function showOnceTemp(t,why){
  const alphabet = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let pw;
  do {
    pw = Array.from(crypto.getRandomValues(new Uint8Array(14)), b => alphabet[b % alphabet.length]).join("");
  } while (!meetsPasswordPolicy(pw));
  window._pw=pw;
  modal(why==="created"?"Team account created":"Password reset",`<div class="notice n-warn small">Shown once. Copy it now and share it securely. It is stored only as a one-way hash and will never be displayed or emailed again.</div><dl class="kv mt16"><dt>Username</dt><dd><code>${esc(t.username)}</code></dd><dt>Temporary password</dt><dd><code style="font-size:15px">${pw}</code></dd></dl>`,`<button class="btn btn-outline" data-act="copypw">Copy</button><button class="btn btn-primary" data-act="modal-close">I've saved it</button>`);
  render();
}
function deleteAccount(){
  const r=R();
  if(r.kind==="founder"){
    const s=st(r.sid); const w=S.wallets[s.id]||{welcome:0,purchased:0};
    const n=cancelPendingFor(x=>x.sid===s.id,"account deleted");
    if(w.welcome) ledger(s.id,"Forfeited on account deletion","Welcome",-w.welcome,"deletion");
    if(w.purchased) ledger(s.id,"Forfeited on account deletion","Purchased",-w.purchased,"deletion");
    w.welcome=0;w.purchased=0;
    S.promotions.forEach(p=>{if(p.sid===s.id&&p.status!=="Completed"){p.status="Completed";p.remaining=0}});
    S.posts.forEach(p=>{if(p.sid===s.id)p.hidden=true});
    S.team.forEach(t=>{if(t.sid===s.id&&t.status==="Active")t.status="Deactivated"});
    S.convs.forEach(c=>{if(c.sid===s.id){c.members=c.members.filter(m=>m==="owner"||m==="investor");c.messages.forEach(m=>{if(m.by==="owner"||(m.by||"").startsWith("t"))m.name="Deleted user"})}});
    S.grants=S.grants.filter(g=>!S.docs.some(d=>d.id===g.doc&&d.sid===s.id)); S.docs=S.docs.filter(d=>d.sid!==s.id);
    S.verif.forEach(v=>{if(v.ref===s.id)v.docs=["[securely erased after account deletion]"]});
    s.deleted=true;s.suspended=true;s.status="Deleted";s.owner="Deleted founder";s.email="";s.phone="";s.name="Deleted startup";
    S.audit.unshift({at:S.now,actor:"system",role:"Account deletion",action:"Founder account permanently deleted",target:s.id,reason:`${n} pending request(s) cancelled; balances forfeited; identity documents erased (no legal hold)`});
    return ok(`Account deleted. ${n} pending request(s) cancelled, tokens forfeited, team deactivated, startup and posts removed.`);
  }
  if(r.kind==="investor"){
    const i=inv(r.iid); const n=cancelPendingFor(x=>x.iid===i.id,"account deleted");
    S.grants=S.grants.filter(g=>g.iid!==i.id);
    S.convs.forEach(c=>{if(c.iid===i.id)c.messages.forEach(m=>{if(m.by==="investor")m.name="Deleted user"})});
    S.verif.forEach(v=>{if(v.ref===i.id)v.docs=["[securely erased after account deletion]"]});
    i.deleted=true;i.status="Deleted";i.name="Deleted investor";i.email="";i.phone="";i.aff="—";
    S.audit.unshift({at:S.now,actor:"system",role:"Account deletion",action:"Investor account permanently deleted",target:i.id,reason:`${n} pending request(s) cancelled; identity documents erased`});
    return ok(`Account deleted. ${n} pending request(s) cancelled and your identity anonymised in remaining conversations.`);
  }
  return fail("forbidden","This account type cannot be deleted here.");

function webhook(o,manual){

  if(o.credited){S.providerEvents.push({id:uid("EV-"),order:o.id,txn:o.txn,at:S.now,sig:"valid",result:"Duplicate — ignored (already credited)"});return fail("duplicate_payment_event","Duplicate confirmation ignored. Tokens were credited only once.")}
  o.credited=true;o.status="Paid";o.method=manual?"Manual reconciliation":"bKash (sandbox)";
  S.wallets[o.sid].purchased+=o.tokens; ledger(o.sid,`Token purchase · ${o.tokens} tokens (order ${o.id})`,"Purchased",o.tokens,"order:"+o.id);
  S.providerEvents.push({id:uid("EV-"),order:o.id,txn:o.txn,at:S.now,sig:"valid",result:`Credited ${o.tokens} Purchased`});
  notify("founder:"+o.sid,`Payment received: ${o.tokens} tokens added. Receipt emailed.`);
  return ok(`Verified payment confirmation — ${o.tokens} Purchased tokens credited.`);
}

/* rename references everywhere after an approved/immediate name change */
function applyName(key,newName){
  const p=S.profiles[key]; const old=p.name; if(old===newName) return;
  p.name=newName; p.nameChangedAt=S.now; p.pendingName=null;
  const [kind,id]=key.split(":");
  Object.values(ROLES).forEach(r=>{if(profKey(r)===key)r.name=newName});
  Object.values(ROLES).forEach(r=>{if(profKey(r)===key&&r.label)r.label=r.label.replace(old,newName)});
  if(kind==="investor"){const i=inv(id);if(i)i.name=newName}
  if(kind==="founder"){const s=st(id);if(s)s.owner=newName}
  if(kind==="team"){const t=S.team.find(x=>x.id===id);if(t)t.name=newName}
  const fix=list=>list.forEach(c=>{if(c.name===old)c.name=newName;if(c.replies)fix(c.replies)});
  S.posts.forEach(x=>fix(x.comments));
  S.convs.forEach(c=>c.messages.forEach(m=>{if(m.name===old)m.name=newName}));
  S.requests.forEach(q=>(q.questions||[]).forEach(x=>{if(x.name===old)x.name=newName}));
  S.meetings.forEach(m=>{if(m.byName===old)m.byName=newName});
}
function validName(n){
  if(n.length<2||n.length>60) return "Use 2–60 characters.";
  if(!/^[\p{L}][\p{L}\p{M} .'’-]*$/u.test(n)) return "Use letters, spaces, dots, apostrophes and hyphens only.";
  if(RESERVED.test(n)) return "Names can't include words like Admin, Official, RiseUp, Verified or Support.";
  return null;
}

/* ----------------------------- Image cropper ------------------------------ */
function openCropper(file,opt,cb){
  const kinds=["image/jpeg","image/png","image/webp"];
  if(!kinds.includes(file.type)) return toast(fail("validation","Use a JPG, PNG or WebP image."));
  if(file.size>opt.maxMB*1048576) return toast(fail("validation",`Images are limited to ${opt.maxMB} MB.`));
  const url=URL.createObjectURL(file); const img=new Image();
  img.onerror=()=>toast(fail("validation","That file couldn't be read as an image."));
  img.onload=()=>{
    if(img.naturalWidth<opt.minW||img.naturalHeight<opt.minH) return toast(fail("validation",`Image is too small — at least ${opt.minW}×${opt.minH} px.`));
    const W=opt.view[0],H=opt.view[1]; let z=1,ox=0,oy=0;
    modal(opt.title,`<div class="crop-wrap"><canvas id="cropc" width="${W}" height="${H}" class="${opt.round?"round":""}" style="max-width:100%;aspect-ratio:${W}/${H}"></canvas></div>
      <label class="field mt16"><span>Zoom</span><input type="range" id="cz" min="1" max="3" step="0.01" value="1"></label>
      <p class="tiny muted mb0">Drag the image to reposition. ${opt.note||""}</p>`,
      `<button class="btn btn-outline" data-act="modal-close">Cancel</button><button class="btn btn-primary" data-act="m-ok">Apply</button>`,
      ()=>{const out=document.createElement("canvas");out.width=opt.out[0];out.height=opt.out[1];draw(out);cb(out.toDataURL("image/jpeg",.86));URL.revokeObjectURL(url);closeModal()});
    const cv=$("#cropc"),ctx=cv.getContext("2d");
    function draw(target){const t=target||cv,c=t.getContext("2d"),tw=t.width,th=t.height;const base=Math.max(tw/img.naturalWidth,th/img.naturalHeight)*z;const dw=img.naturalWidth*base,dh=img.naturalHeight*base;const maxX=(dw-tw)/2,maxY=(dh-th)/2;ox=Math.max(-1,Math.min(1,ox));oy=Math.max(-1,Math.min(1,oy));c.fillStyle="#fff";c.fillRect(0,0,tw,th);c.drawImage(img,(tw-dw)/2+ox*maxX,(th-dh)/2+oy*maxY,dw,dh)}
    draw();
    $("#cz").oninput=e=>{z=+e.target.value;draw()};
    let drag=null; cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
    cv.onpointermove=e=>{if(!drag)return;const rect=cv.getBoundingClientRect();ox=drag.ox-(e.clientX-drag.x)/(rect.width/2);oy=drag.oy-(e.clientY-drag.y)/(rect.height/2);draw()};
    cv.onpointerup=()=>{drag=null};
  };
  img.src=url;
}

      <div class="row">${cta}<a class="btn btn-ghost" href="#startup-${s.id}">View details</a></div>
    </div></article>`;
}
function spotlightOrder(){
  const r=R(); const viewer=r.kind==="investor"?inv(r.iid):null;
  let list=S.startups.filter(s=>isVerified(s)&&pkgOf(s.id)?.teaser&&!(r.kind==="founder"&&r.sid===s.id));
  return viewer?rank(list,s=>matchScore(s,viewer)).map(m=>m.x):list.sort((a,b)=>b.views-a.views);
}
function feedSide(){
  const r=R(); const viewer=r.kind==="investor"?inv(r.iid):null;
  let sugg=S.startups.filter(s=>isVerified(s)&&!(r.kind==="founder"&&r.sid===s.id));
  const ranked=viewer?rank(sugg.filter(s=>!connected(s.id,viewer.id)),s=>matchScore(s,viewer)).map(m=>m.x):sugg.sort((a,b)=>b.views-a.views);
  const trend=spotlightOrder().slice(0,4);
  const saved=signedIn()?savedSet().size:0;
  return `${r.kind==="visitor"?`<div class="card side-card hero-mini"><strong>Bangladesh's verified startup network</strong><p class="small mt8">Every founder and investor is manually verified. Browse freely — join to like, comment and connect.</p><div class="row"><a class="btn btn-primary btn-sm" href="#register">Join RiseUp</a><a class="btn btn-ghost btn-sm" style="color:#fff" href="#about">Learn more</a></div></div>`:""}
  <div class="card side-card ${r.kind==="visitor"?"mt16":""}"><div class="row between"><h4 class="mb0">🔥 Trending pitches</h4><a class="tiny" href="#reels">See all</a></div>
    ${trend.map(s=>{const p=pkgOf(s.id);return `<button class="tp" data-act="playteaser" data-sid="${s.id}"><span class="tp-th"><img src="${esc(p.teaser.poster)}" alt=""><span>▶</span></span><span style="min-width:0;text-align:left"><strong class="small ell" style="display:block">${esc(s.name)}</strong><span class="tiny muted ell" style="display:block">${esc(s.industry)} · ${esc(s.stage)}</span></span></button>`}).join("")}</div>
  <div class="card side-card mt16"><div class="row between"><h4 class="mb0">${viewer?"Recommended for you":"Popular startups"}</h4>${viewer?`<span class="badge ${S.ai2Down?"b-warn":"b-ver"}">${S.ai2Down?"Rule-based":"AI Model 2"}</span>`:""}</div>
    ${ranked.slice(0,4).map(s=>`<div class="sugg">${logo(s)}<div style="flex:1;min-width:0"><a href="#startup-${s.id}" class="small" style="font-weight:650;color:var(--ink)">${esc(s.name)}</a><div class="tiny muted ell">${esc(s.industry)} · ${esc(s.stage)}</div></div><a class="btn btn-outline btn-sm" href="#startup-${s.id}">View</a></div>`).join("")}
    <a class="small" href="#startups">See all startups →</a></div>
  <div class="card side-card mt16"><h4>Verified investors</h4>${S.investors.filter(i=>i.status==="Verified").slice(0,4).map(i=>`<div class="sugg">${av(i.name,i.c)}<div style="flex:1;min-width:0"><a href="#investor-${i.id}" class="small" style="font-weight:650;color:var(--ink)">${esc(i.name)}</a><div class="tiny muted ell">${esc(i.aff)}</div></div><a class="btn btn-outline btn-sm" href="#investor-${i.id}">View</a></div>`).join("")}<a class="small" href="#investors">See all investors →</a></div>
  ${saved?`<div class="card side-card mt16 row between"><span class="small">🔖 <strong>${saved}</strong> saved post${saved===1?"":"s"}</span><button class="linkbtn small" data-act="ftab" data-t="saved">Open</button></div>`:""}
  <p class="tiny muted mt16">RiseUp is not an investment adviser or broker. Posts are founder-published and pass an automated safety check.</p>`;
}
function pageHome(){
  const fs=window._feed||(window._feed={tab:"foryou",cat:"",n:5}); const r=R();
  let posts=feedPosts(fs); if(fs.tab==="saved"){const sv=savedSet();posts=S.posts.filter(p=>sv.has(p.id)&&p.live&&!p.hidden&&!st(p.sid).suspended).sort((a,b)=>b.at-a.at)}
  const shown=posts.slice(0,fs.n);
  const cats=["Announcements","Milestones","Products","Achievements","Funding","Hiring"];
  const spots=spotlightOrder(); let si=0;
  const items=[]; shown.forEach((p,i)=>{items.push(igPost(p)); if(fs.tab!=="saved"&&(i===0||i===3||i===6)&&spots[si]) items.push(pitchCard(spots[si++].id))});
  const tabs=[["foryou","For you"],["latest","Latest"],["reels","▶ Reels"]].concat(signedIn()?[["saved","🔖 Saved"]]:[]);
  const center=`<div style="min-width:0">
    ${composer()}
    ${stories()}
    <div class="feed-tabs" role="tablist" aria-label="Feed">${tabs.map(([k,l])=>`<button class="pill ${fs.tab===k?"on":""}" role="tab" aria-selected="${fs.tab===k}" data-act="ftab" data-t="${k}">${l}</button>`).join("")}
      <label class="sr" for="fcat">Category</label><select id="fcat" class="input" style="width:auto;margin-left:auto;padding:6px 10px;border-radius:999px;font-size:13px"><option value="">All categories</option>${cats.map(c=>`<option ${fs.cat===c?"selected":""}>${c}</option>`).join("")}</select></div>
    ${fs.tab==="foryou"&&r.kind==="investor"?`<p class="tiny muted" style="margin:-6px 0 12px">Ordered by relevance to your preferences (${S.ai2Down?"rule-based fallback":"AI Model 2"}). Promoted posts are always labelled.</p>`:""}
    ${fs.tab==="reels"?reelsList():items.length?items.join(""):`<div class="card">${empty(fs.tab==="saved"?"No saved posts yet":"No posts in this category yet",fs.tab==="saved"?"Tap Save on any post to keep it here.":"Try another category.")}</div>`}
    ${fs.tab==="reels"?"":posts.length>fs.n?`<button class="btn btn-outline" style="width:100%" data-act="feedmore">Load more posts</button>`:shown.length?`<p class="small muted" style="text-align:center">✓ You're all caught up</p>`:""}
  </div>`;
  if(signedIn()) return `<div class="feed-wrap in-app">${center}<aside class="feed-side" aria-label="Suggestions">${feedSide()}</aside></div>`;
  return `<div class="container feed-wrap pub3"><aside class="feed-left" aria-label="Explore">${feedLeft()}</aside>${center}<aside class="feed-side" aria-label="Suggestions">${feedSide()}</aside></div>`;
}

/* ----------------------------- Profile pages ------------------------------ */
