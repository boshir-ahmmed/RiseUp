  const r=R(); const p=myProf(); const c=colorFor(r); const ver=isAccountVerified(r);
  const roleLine=r.kind==="founder"?`Founder of <a href="#startup-${r.sid}">${esc(st(r.sid).name)}</a>`:r.kind==="investor"?esc(inv(r.iid).aff):r.kind==="team"?`Team member at <a href="#startup-${S.team.find(t=>t.id===r.tid).sid}">${esc(st(S.team.find(t=>t.id===r.tid).sid).name)}</a>`:"RiseUp administration";
  return `<div class="card prof"><div class="prof-cover" style="${coverStyle(p,c)}"></div>
    <div class="prof-b"><div class="prof-av">${avBig(p,132,c)}</div>
      <div class="row between" style="align-items:flex-start"><div><h1 class="prof-n">${esc(p.name)} ${ver?`<span class="vtick" style="font-size:14px;width:22px;height:22px" title="Verified account">✓</span>`:""}</h1>
        <div class="prof-hl">${esc(p.headline)}</div>
        <div class="small muted mt8">${p.location?`<span class="row" style="display:inline-flex;gap:4px">${IC.pin} ${esc(p.location)}</span> · `:""}${roleLine}${p.link?` · <a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">${IC.link} ${esc(p.link.replace(/^https?:\/\//,""))}</a>`:""}</div>
        ${p.pendingName?`<div class="notice n-info small mt16" style="display:block">Name change to <strong>${esc(p.pendingName)}</strong> is waiting for a Verification Administrator. Your current name stays visible until it's approved.</div>`:""}</div>
        <div class="row"><a class="btn btn-primary" href="#account">${IC.edit} Edit profile</a>${r.kind==="investor"?`<a class="btn btn-outline" href="#investor-${r.iid}">Public investor page</a>`:r.kind==="founder"?`<a class="btn btn-outline" href="#startup-${r.sid}">Startup page</a>`:""}</div></div>
    </div></div>
  <div class="grid mt16" style="grid-template-columns:2fr 1fr;align-items:start" id="pgrid">
    <div class="stack"><div class="card card-b"><h3>About</h3>${p.bio?`<p class="mb0" style="white-space:pre-wrap">${esc(p.bio)}</p>`:`<p class="muted small mb0">${r.kind==="team"?"Team-member profiles show name, title and photo only.":"Add a short bio so founders and investors know who you are."}</p>`}</div>
      ${r.kind==="founder"?`<div class="card card-b"><h3>Startup</h3>${startupMini(st(r.sid))}</div>`:""}
      ${r.kind==="investor"?`<div class="card card-b"><h3>Investment focus</h3><div class="chips">${inv(r.iid).industries.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><div class="small muted mt8">${esc(inv(r.iid).stages.join(", "))} · ${usd(inv(r.iid).min)}–${usd(inv(r.iid).max)} (visible to verified startups)</div></div>`:""}
    </div>
    <div class="stack"><div class="card card-b"><h3>Profile strength</h3>${strength(p,r)}</div>
      <div class="card card-b small muted">Who sees this: ${r.kind==="admin"?"administrators only":"signed-in founders and investors see your name, photo and headline next to your comments and messages. Contact details stay private until a connection."}</div></div>
  </div>`;
}
function startupMini(s){return `<div class="row" style="flex-wrap:nowrap">${logo(s)}<div style="flex:1;min-width:0"><strong>${esc(s.name)}</strong><div class="small muted ell">${esc(s.tagline)}</div></div><a class="btn btn-outline btn-sm" href="#profile">Edit startup</a></div>`}
function strength(p,r){
  const items=r.kind==="team"?[["Profile photo",!!p.photo]]:[["Profile photo",!!p.photo],["Cover photo",!!p.cover],["Headline",p.headline.length>=10],["Location",!!p.location],["Bio (80+ characters)",p.bio.length>=80],["Website or LinkedIn",!!p.link]];
  const pct=Math.round(items.filter(x=>x[1]).length/items.length*100);
  return `<div class="row between"><strong>${pct}%</strong><span class="tiny muted">${pct===100?"All-star profile":"Complete your profile"}</span></div><div class="bar mt8"><i style="width:${pct}%"></i></div><ul class="checklist">${items.map(([t,ok2])=>`<li class="${ok2?"ok":""}">${ok2?"✓":"○"} ${t}</li>`).join("")}</ul>`;
}
function pageAccount(){
  const r=R(); const p=myProf(); const c=colorFor(r); const team=r.kind==="team"; const ver=isAccountVerified(r);
  const nextName=p.nameChangedAt?p.nameChangedAt+NAME_COOLDOWN:0; const locked=nextName>S.now;
  return pageH("Edit profile",team?"Team members can update their profile photo. Your name and title are managed by your startup's Main Owner.":"Changes to your photo, headline and bio apply immediately.",`<a class="btn btn-outline" href="#me">View profile</a>`)+
  `<div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start" id="pgrid2">
  <div class="stack">
    <div class="card card-b"><h3>Profile photo</h3><div class="row" style="gap:18px;flex-wrap:nowrap">${avBig(p,96,c)}<div><div class="row"><label class="btn btn-primary btn-sm" style="cursor:pointer">${IC.cam} ${p.photo?"Change photo":"Upload photo"}<input type="file" class="sr" accept="image/jpeg,image/png,image/webp" data-act="upphoto"></label>${p.photo?`<button class="btn btn-ghost btn-sm" data-act="rmphoto">Remove</button>`:""}</div><p class="tiny muted mt8 mb0">JPG, PNG or WebP · up to 5 MB · at least 200×200 px. Use a clear photo of your face — logos belong on the startup profile.</p></div></div></div>
    ${team?`<div class="card card-b"><h3>Name &amp; title</h3><div class="grid g2"><label class="field"><span>Name</span><input class="input" value="${esc(p.name)}" disabled></label><label class="field"><span>Title</span><input class="input" value="${esc(p.headline)}" disabled></label></div><div class="lock mt8">🔒 Ask your Main Startup Owner to change your name or title from Team accounts.</div></div>`:`
    ${r.kind!=="admin"?`<div class="card card-b"><h3>Cover photo</h3><div class="cover-prev" style="${coverStyle(p,c)}"></div><div class="row mt8"><label class="btn btn-outline btn-sm" style="cursor:pointer">${IC.cam} ${p.cover?"Change cover":"Upload cover"}<input type="file" class="sr" accept="image/jpeg,image/png,image/webp" data-act="upcover"></label>${p.cover?`<button class="btn btn-ghost btn-sm" data-act="rmcover">Remove</button>`:""}<span class="tiny muted">Up to 8 MB · wide images (4:1) work best</span></div></div>`:""}
    <form class="card card-b stack" data-form="account"><h3>Basic info</h3>
      <label class="field"><span>Display name ${ver?`<span class="badge b-ver" style="margin-left:6px">Verified account</span>`:""}</span><input class="input" name="name" value="${esc(p.pendingName||p.name)}" maxlength="60" ${p.pendingName||locked?"disabled":""}>
        <div class="help"><span>${p.pendingName?`⏳ “${esc(p.pendingName)}” is pending review. <button type="button" class="linkbtn tiny" data-act="cancelname">Cancel request</button>`:locked?`You changed your name recently. Next change available ${fmtD(nextName)}.`:ver?"Must match the ID on your verification file. A Verification Administrator reviews the change; your current name stays until approved. One change per 30 days.":"One change per 30 days."}</span></div></label>
      <label class="field"><span>Headline</span><input class="input" name="headline" value="${esc(p.headline)}" maxlength="120" data-c="hl">${counter("hl",120)}</label>
      <div class="grid g2"><label class="field"><span>Location</span><input class="input" name="location" value="${esc(p.location)}" maxlength="80"></label><label class="field"><span>Website or LinkedIn</span><input class="input" name="link" value="${esc(p.link)}" maxlength="200" placeholder="https://"></label></div>
      <label class="field"><span>About</span><textarea class="input" name="bio" rows="5" maxlength="600" data-c="bio">${esc(p.bio)}</textarea>${counter("bio",600)}</label>
      <div class="row"><button class="btn btn-primary">Save changes</button><a class="btn btn-ghost" href="#me">Cancel</a></div>
    </form>
    ${r.kind==="founder"?`<div class="card card-b row between"><div><strong>Startup profile</strong><div class="small muted">Logo, cover, tagline, description and metrics live on the startup profile.</div></div><a class="btn btn-outline" href="#profile">Edit startup profile</a></div>`:""}
    ${r.kind==="investor"?`<div class="card card-b row between"><div><strong>Investment preferences</strong><div class="small muted">Affiliation, industries, stages and ticket range.</div></div><a class="btn btn-outline" href="#profile">Edit preferences</a></div>`:""}`}
  </div>
  <div class="stack" style="position:sticky;top:calc(var(--dbh,40px) + 80px)"><div class="tiny muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.06em">Preview</div>
    <div class="card spc" style="margin:0"><div class="spc-cover" style="${coverStyle(p,c)};height:72px"></div><div class="spc-av">${avBig(p,72,c)}</div><div class="spc-b"><strong>${esc(p.name)}</strong>${ver?` <span class="vtick">✓</span>`:""}<div class="small muted">${esc(p.headline)}</div>${p.location?`<div class="tiny muted mt8">${esc(p.location)}</div>`:""}</div></div>
    <div class="card card-b"><h4>How it appears in comments</h4><div class="pc-c" style="padding:0">${avBig(p,32,c)}<div class="pc-cb"><strong class="small">${esc(p.name)}</strong><div class="small">Great progress — congratulations to the team!</div></div></div></div>
    <div class="card card-b small muted"><strong style="color:var(--ink)">Rules</strong><ul style="padding-left:18px;margin:8px 0 0"><li>Photos apply instantly; reported photos are reviewed by moderators.</li><li>Names: letters only, 2–60 characters, no impersonation words (Admin, Official, RiseUp…).</li><li>Verified accounts: name changes need ID-matching review.</li><li>Team members change their photo only.</li><li>Every change is recorded in the audit log.</li></ul></div>
  </div></div>`;
}

/* ----------------------------- Admin: profile changes ---------------------- */
function adminProfiles(){
  const q=S.nameReqs.slice().sort((a,b)=>b.at-a.at);
  return pageH("Profile name changes","Verified accounts must keep the name on their ID. Compare against the verification file before approving.")+
  `<div class="card">${q.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Account</th><th>Current → requested</th><th>Requested</th><th>Status</th><th></th></tr></thead><tbody>${q.map(x=>`<tr><td><strong>${esc(x.label)}</strong><div class="tiny muted">${esc(x.key)}</div></td><td>${esc(x.from)} → <strong>${esc(x.to)}</strong></td><td class="small">${fmt(x.at)}</td><td>${badge(x.status)}${x.reason?`<div class="tiny muted">${esc(x.reason)}</div>`:""}</td><td>${x.status==="Pending"?`<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn btn-primary btn-sm" data-act="nameok" data-n="${x.id}">Approve</button><button class="btn btn-danger btn-sm" data-act="nameno" data-n="${x.id}">Reject</button></div>`:""}</td></tr>`).join("")}</tbody></table></div>`:empty("No name-change requests","Requests from verified founders and investors appear here.")}</div>`;
}

/* ----------------------------- Events ------------------------------------- */
document.addEventListener("change",e=>{
  const t=e.target; const a=t.dataset.act; if(!a) return; const r=R();
  if(a==="upphoto"&&t.files[0]){const key=profKey();openCropper(t.files[0],PHOTO_OPT,url=>{S.profiles[key].photo=url;audit("Profile photo updated",key,"");toast(ok("Profile photo updated."));render()});t.value=""}
  if(a==="upcover"&&t.files[0]){if(r.kind==="team")return toast(fail("forbidden","Team members can change their profile photo only."));const key=profKey();openCropper(t.files[0],COVER_OPT,url=>{S.profiles[key].cover=url;audit("Cover photo updated",key,"");toast(ok("Cover photo updated."));render()});t.value=""}
  if(a==="uplogo"&&t.files[0]){if(r.kind!=="founder")return;const s=st(r.sid);openCropper(t.files[0],LOGO_OPT,url=>{s.logoImg=url;audit("Startup logo updated",s.id,"");toast(ok("Logo updated everywhere on RiseUp."));render()});t.value=""}
  if(a==="upscover"&&t.files[0]){if(r.kind!=="founder")return;const s=st(r.sid);openCropper(t.files[0],COVER_OPT,url=>{s.coverImg=url;audit("Startup cover updated",s.id,"");toast(ok("Startup cover updated."));render()});t.value=""}
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".tb-me")) document.querySelectorAll(".tb-me .menu").forEach(m=>{m.hidden=true;m.previousElementSibling?.setAttribute("aria-expanded","false")});
  const el=e.target.closest("[data-act]"); if(!el||el.tagName==="INPUT") return; const a=el.dataset.act; const r=R();
  const A={
    memenu:()=>{const m=el.nextElementSibling;m.hidden=!m.hidden;el.setAttribute("aria-expanded",String(!m.hidden))},
    rmphoto:()=>{myProf().photo=null;audit("Profile photo removed",profKey(),"");toast(ok("Photo removed — your initials are shown instead."));render()},
    rmcover:()=>{myProf().cover=null;render()},
    rmlogo:()=>{if(r.kind==="founder"){st(r.sid).logoImg=null;render()}},
    rmscover:()=>{if(r.kind==="founder"){st(r.sid).coverImg=null;render()}},
    cancelname:()=>{const p=myProf();const q=S.nameReqs.find(x=>x.key===p.key&&x.status==="Pending");if(q){q.status="Cancelled"}p.pendingName=null;toast(ok("Name change request cancelled."));render()},
    nameok:()=>{const q=S.nameReqs.find(x=>x.id===el.dataset.n);if(!q||q.status!=="Pending")return;q.status="Approved";q.by=r.name;applyName(q.key,q.to);audit("Name change approved",q.key,`${q.from} → ${q.to}`);notify(q.key.replace(/^admin:.*/,"admin"),`Your name change to “${q.to}” was approved.`);toast(ok("Approved — the new name is live everywhere."));render()},
    nameno:()=>{const q=S.nameReqs.find(x=>x.id===el.dataset.n);if(!q)return;askReason("Reject name change","Reason shown to the user",v=>{q.status="Rejected";q.reason=v;const p=S.profiles[q.key];p.pendingName=null;audit("Name change rejected",q.key,v);notify(q.key,`Your name change to “${q.to}” was not approved: ${v}`);toast(ok("Rejected. The user keeps their current name."));render()})},
    savepost:()=>{if(!signedIn())return toast(fail("unauthenticated","Sign in to save posts."));const sv=savedSet();sv.has(el.dataset.p)?sv.delete(el.dataset.p):sv.add(el.dataset.p);toast(ok(sv.has(el.dataset.p)?"Saved. Find it under 🔖 Saved in your feed.":"Removed from saved."));render()},
    playteaser:()=>{const s=st(el.dataset.sid);const p=pkgOf(s.id);modal(`${esc(s.name)} — teaser`,`${player(p.teaser,{autoplay:true})}<p class="small mt16 mb0">${esc(s.tagline)}</p>`,`<a class="btn btn-outline" href="#startup-${s.id}" data-act="modal-close-link">View startup</a>${p.demo?`<button class="btn btn-outline" data-act="playdemo" data-sid="${s.id}">Product demo</button>`:""}<button class="btn btn-primary" data-act="modal-close">Close</button>`)},
  };
  if(A[a]){e.preventDefault();A[a]()}
});
document.addEventListener("submit",e=>{
  const f=e.target; const k=f.dataset.form; if(k!=="account"&&k!=="tbsearch") return; e.preventDefault(); e.stopImmediatePropagation();
  if(k==="tbsearch"){const ss=searchState();ss.q=f.q.value.trim();ss.page=1;go("startups");return}
  const r=R(); if(r.kind==="team") return toast(fail("forbidden","Team members can change their profile photo only."));
  const p=myProf(); const key=p.key;
  const link=f.link.value.trim(); if(link&&!/^https?:\/\/[^\s.]+\.[^\s]+$/i.test(link)) return toast(fail("validation","Enter a full link starting with https://"));
  const headline=f.headline.value.trim(); if(headline.length<2) return toast(fail("validation","Add a headline (2–120 characters)."));
  p.headline=headline.slice(0,120); p.location=f.location.value.trim().slice(0,80); p.bio=f.bio.value.trim().slice(0,600); p.link=link;
  let msg="Profile saved.";
  if(f.name&&!f.name.disabled){
    const nn=f.name.value.trim().replace(/\s+/g," ");
    if(nn!==p.name){
      const err=validName(nn); if(err){render();return toast(fail("validation",err))}
      if(p.nameChangedAt&&S.now-p.nameChangedAt<NAME_COOLDOWN){render();return toast(fail("cooldown",`You can change your name again on ${fmtD(p.nameChangedAt+NAME_COOLDOWN)}.`))}
      if(isAccountVerified(r)){
        p.pendingName=nn; S.nameReqs.push({id:uid("NR"),key,label:r.kind==="founder"?`${p.name} (founder, ${st(r.sid).name})`:`${p.name} (investor)`,from:p.name,to:nn,at:S.now,status:"Pending"});
        audit("Name change requested",key,`${p.name} → ${nn}`); msg="Saved. Your name change was sent for review — your current name stays until it's approved.";
      } else { const old=p.name; applyName(key,nn); audit("Name changed",key,`${old} → ${nn}`); msg="Profile saved with your new name."; }
    }
  }
  audit("Profile updated",key,""); toast(ok(msg)); render();
},true);

seed(); seedV3(); seedV4(); render();
