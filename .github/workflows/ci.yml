name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalCi#RiseUp2026"
        ports: ["1433:1433"]
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P LocalCi#RiseUp2026 -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      RISEUP_TEST_SQLSERVER: "Server=127.0.0.1,1433;User ID=sa;Password=LocalCi#RiseUp2026;TrustServerCertificate=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore RiseUp.slnx
      - run: dotnet build RiseUp.slnx -c Release --no-restore
      - run: dotnet test RiseUp.slnx -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage"
      - run: dotnet list package --vulnerable --include-transitive
      - name: Verify migrations are up to date
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes --project src/RiseUp.DataAccess --startup-project src/RiseUp.DataAccess
      - name: Install and repeat the SQL Server development demo
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Storage__RootPath: ${{ runner.temp }}/riseup-demo-media
        run: |
          export RISEUP_MIGRATIONS_CONNECTION="${RISEUP_TEST_SQLSERVER}Initial Catalog=RiseUpDemoCheck"
          demo=(database update --configuration Release --no-build -c RiseUpDbContext --project src/RiseUp.DataAccess --startup-project src/RiseUp.Web.UI -- --seed-demo)
          dotnet ef "${demo[@]}"
          find "$Storage__RootPath" -type f -printf '%f\n' | sort > "$RUNNER_TEMP/seed-first"
          dotnet ef "${demo[@]}"
          find "$Storage__RootPath" -type f -printf '%f\n' | sort > "$RUNNER_TEMP/seed-second"
          diff "$RUNNER_TEMP/seed-first" "$RUNNER_TEMP/seed-second"
          docker exec ${{ job.services.sql.id }} sh -c 'export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; exec /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b -d RiseUpDemoCheck -Q "$1"' sh "
            IF (SELECT COUNT(*) FROM MemberProfiles WHERE PhotoMediaId IS NOT NULL) <> 19 THROW 51000, 'Missing portraits', 1;
            IF (SELECT COUNT(*) FROM Startups WHERE CoverMediaId IS NOT NULL AND LogoMediaId IS NOT NULL) <> 8 THROW 51000, 'Missing startup branding', 1;
            IF (SELECT COUNT(*) FROM Posts p JOIN MediaAssets m ON m.Id=p.VideoMediaId WHERE m.FileName LIKE 'reel-%.mp4' AND p.LiveTitle IS NOT NULL) <> 4 THROW 51000, 'Missing reels', 1;
            IF (SELECT COUNT(*) FROM Posts p JOIN MediaAssets m ON m.Id=p.PosterMediaId WHERE m.FileName LIKE 'field-%.jpg') <> 4 THROW 51000, 'Missing image posts', 1;
            IF (SELECT COUNT(*) FROM UserAccounts) <> 18 THROW 51000, 'Unexpected account count', 1;"
      - name: Serve SQL Server profile artwork with a fresh media directory
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5087
          Storage__RootPath: ${{ runner.temp }}/riseup-recovered-gallery
          Jobs__Enabled: "false"
        run: |
          export ConnectionStrings__RiseUp="${RISEUP_TEST_SQLSERVER}Initial Catalog=RiseUpDemoCheck"
          dotnet run --project src/RiseUp.Web.UI -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/gallery-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          base="$ASPNETCORE_URLS"
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 "$base/health" || { cat "$RUNNER_TEMP/gallery-server.log"; exit 1; }
          web=src/RiseUp.Web.UI
          curl -fsS "$base/images/identity/member.jpg" | cmp - "$web/wwwroot/images/identity/member.jpg"
          check_image() {
            url=$(curl -fsS "$base/search/suggestions?scope=$1&q=$2" | jq -er '.[0].photo | select(startswith("/media/"))')
            curl -fsS "$base$url" | cmp - "$web/DemoMedia/$3"
          }
          check_image investors Padma portrait-sadia.jpg
          check_image startups Nodi logo-farhan.jpg
