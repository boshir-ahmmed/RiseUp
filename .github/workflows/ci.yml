name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore RiseUp.slnx
      - run: dotnet build RiseUp.slnx -c Release --no-restore
      - run: dotnet test RiseUp.slnx -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage"
      - run: dotnet list package --vulnerable --include-transitive
      - name: Verify migrations are up to date
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes --project src/RiseUp.DataAccess --startup-project src/RiseUp.DataAccess
